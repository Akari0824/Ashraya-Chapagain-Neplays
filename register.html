<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - NEPLAYS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-orange-500">
        <h2 class="text-3xl font-bold brand-font text-center mb-6">CREATE ACCOUNT</h2>
        <form onsubmit="event.preventDefault(); localStorage.setItem('userEmail', document.getElementById('reg-email').value); window.location.href='index.html';" class="space-y-4">
            <input type="text" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-orange-500 outline-none" placeholder="Full Name">
            <input type="email" id="reg-email" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-orange-500 outline-none" placeholder="Email Address">
            <input type="password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-orange-500 outline-none" placeholder="Create Password">
            <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded-lg font-bold hover:bg-orange-500 transition shadow-md">Register</button>
        </form>
        <p class="text-center text-sm text-slate-500 mt-4">Already have an account? <a href="login.html" class="text-orange-500 font-bold hover:underline">Log in</a></p>
    </div>
</body>
</html>
